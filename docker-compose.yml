version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: medikiosk-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: medikiosk
    ports:
      - "5432:5432" # Optional, can be removed for production safety if host access isn't needed
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medikiosk"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medikiosk-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-password}@db:5432/medikiosk
      - ENVIRONMENT=production
      - BACKEND_CORS_ORIGINS=["http://localhost:3000"]
      - LLM_PROVIDER=mock
      - OCR_PROVIDER=mock
      - SPEECH_PROVIDER=mock
      - STORAGE_PROVIDER=local
      - STORAGE_DIR=/app/storage
    volumes:
      - medikiosk_storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        INTERNAL_API_URL: http://backend:8000
    container_name: medikiosk-frontend
    ports:
      - "3000:3000"
    environment:
      - INTERNAL_API_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  medikiosk_storage:
